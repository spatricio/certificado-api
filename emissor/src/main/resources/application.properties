spring.application.name=emissor
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/emissor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:certificado}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-dev-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:certificado}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:local-dev-only}
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.delivery-mode=persistent
