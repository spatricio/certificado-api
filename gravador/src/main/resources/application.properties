spring.application.name=gravador
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/gravador}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:certificado}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-dev-only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:certificado}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:local-dev-only}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.cache.type=redis
spring.cache.redis.time-to-live=PT5M
spring.cache.redis.cache-null-values=false
